services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    # Том, щоб дані переживали перезапуск контейнера.
    # У PostgreSQL 18 дані лежать у /var/lib/postgresql/18/docker, тому монтуємо батьківську теку.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
